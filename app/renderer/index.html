<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>原搭 · 让想法成为可交互的作品</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="workspace-tools.css">
  <link rel="stylesheet" href="outline-tools.css">
  <link rel="stylesheet" href="navigation-tools.css">
  <link rel="stylesheet" href="advanced-tools.css">
  <link rel="stylesheet" href="image-tools.css">
  <link rel="stylesheet" href="style-tools.css">
  <link rel="stylesheet" href="vector-tools.css">
  <link rel="stylesheet" href="library-tools.css">
  <link rel="stylesheet" href="drag-preview.css">
  <link rel="stylesheet" href="docking-enhancements.css">
  <link rel="stylesheet" href="editor-shell.css">
</head>
<body>
  <svg class="icon-definitions" aria-hidden="true"><defs>
    <symbol id="i-cursor" viewBox="0 0 24 24"><path d="m5 3 14 9-7 1-3 7-4-17Z"/></symbol>
    <symbol id="i-rectangle" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 7V4h16v3M12 4v16M8 20h8"/></symbol>
    <symbol id="i-button" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M8 12h8"/></symbol>
    <symbol id="i-input" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 9v6m-2-6h4m-4 6h4"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="m3 16 5-4 4 3 4-5 5 7"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M8 5 3 10l5 5M3 10h11a6 6 0 0 1 0 12"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="m16 5 5 5-5 5m5-5H10a6 6 0 0 0 0 12"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 4 12 8-12 8V4Z"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-panels" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 3v18M16 3v18M8 8h8"/></symbol>
    <symbol id="i-agent" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="14" rx="3"/><path d="M12 3v3M8 12h.1M16 12h.1M8 16h8"/></symbol>
    <symbol id="i-page" viewBox="0 0 24 24"><path d="M14 3H5v18h14V8l-5-5ZM14 3v5h5M8 12h8M8 16h8"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6h7l2 3h9v11H3V6ZM3 6V4h7l2 2h8v3"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m3 8 9-5 9 5-9 5-9-5Zm0 5 9 5 9-5m-18 5 9 5 9-5"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-component" viewBox="0 0 24 24"><path d="m12 2 4 4-4 4-4-4 4-4Zm-6 6 4 4-4 4-4-4 4-4Zm12 0 4 4-4 4-4-4 4-4Zm-6 6 4 4-4 4-4-4 4-4Z"/></symbol>
    <symbol id="i-style" viewBox="0 0 24 24"><path d="m14 3 7 7-10 10H4v-7L14 3Zm-7 8 6 6M4 20h16"/></symbol>
    <symbol id="i-interaction" viewBox="0 0 24 24"><path d="m13 2-9 12h7l-1 8 10-13h-8l1-7Z"/></symbol>
    <symbol id="i-notes" viewBox="0 0 24 24"><path d="M4 3h16v13l-5 5H4V3Zm11 18v-5h5M8 7h8M8 11h8"/></symbol>
    <symbol id="i-float" viewBox="0 0 24 24"><rect x="3" y="7" width="14" height="14" rx="1"/><path d="M7 3h14v14M12 12l9-9M15 3h6v6"/></symbol>
    <symbol id="i-grip" viewBox="0 0 24 24"><path d="M8 5h.1M8 12h.1M8 19h.1M15 5h.1M15 12h.1M15 19h.1" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 1 1 4 3c-1 .5-1 1-1 2M12 17h.1"/></symbol>
  </defs></svg>
  <header class="topbar">
    <div class="brand"><svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="3" width="22" height="22" rx="5"/><path d="M9 9h10v10H9zM9 14h10M14 9v10"/></svg><strong>原搭</strong><span class="edition">设计工作区</span></div>
    <div class="document-title"><input id="project-name" aria-label="项目名称" spellcheck="false"><span id="save-status">正在打开</span></div>
    <div class="top-actions">
      <button id="new-project" title="新建项目">新建</button><button id="open-project" title="打开项目 Ctrl+O">打开</button><button id="save-project" title="保存 Ctrl+S">保存</button>
      <span class="top-divider"></span><button id="preview-project" class="preview-button"><svg class="icon" aria-hidden="true"><use href="#i-play"/></svg>预览</button>
      <div class="dropdown"><button id="export-toggle" class="primary-button" aria-expanded="false">导出<svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg></button><div id="export-menu" class="dropdown-menu" hidden><button id="export-rp">Axure 项目 .rp<span>基础图形、图片和页面跳转</span></button><button id="export-html">可交互 HTML<span>一个文件，离线也能打开</span></button><button id="save-as">原搭工程备份<span>保留全部可编辑内容（.yuanda）</span></button></div></div>
    </div>
  </header>
  <div class="toolbar">
    <div class="toolgroup"><button id="undo" class="icon-button" title="撤销 Ctrl+Z" aria-label="撤销"><svg class="icon"><use href="#i-undo"/></svg></button><button id="redo" class="icon-button" title="重做 Ctrl+Shift+Z" aria-label="重做"><svg class="icon"><use href="#i-redo"/></svg></button></div>
    <span class="toolbar-divider"></span>
    <div class="insert-tools" aria-label="插入元件">
      <button class="tool-button selected" id="select-tool" title="选择工具 V"><svg class="icon"><use href="#i-cursor"/></svg><span>选择</span></button>
      <button class="tool-button" data-insert="rectangle" title="添加矩形 R"><svg class="icon"><use href="#i-rectangle"/></svg><span>矩形</span></button>
      <button class="tool-button" data-insert="text" title="添加文字 T"><svg class="icon"><use href="#i-text"/></svg><span>文字</span></button>
      <button class="tool-button" data-insert="button" title="添加按钮 B"><svg class="icon"><use href="#i-button"/></svg><span>按钮</span></button>
      <button class="tool-button" data-insert="input"><svg class="icon"><use href="#i-input"/></svg><span>输入框</span></button>
      <button class="tool-button" id="import-image"><svg class="icon"><use href="#i-image"/></svg><span>图片</span></button>
      <button class="tool-button" id="style-painter" aria-pressed="false" title="复制外观与格式刷"><svg class="icon"><use href="#i-style"/></svg><span>格式刷</span></button>
    </div>
    <div class="toolbar-right"><button id="snap-toggle" class="chip active" aria-pressed="true" title="拖动和缩放时对齐网格">吸附<span id="snap-state">开</span></button><div class="dropdown panel-menu-wrapper"><button id="panels-toggle" class="tool-button" aria-expanded="false"><svg class="icon"><use href="#i-panels"/></svg>面板</button><div id="panels-menu" class="dropdown-menu" hidden></div></div><button id="agent-toggle" class="agent-toggle" aria-expanded="false"><svg class="icon"><use href="#i-agent"/></svg><span class="status-dot"></span>Agent 工作台</button><div class="zoom-control"><button id="zoom-out" title="缩小" aria-label="缩小"><svg class="icon"><use href="#i-minus"/></svg></button><button id="zoom-value" title="适应窗口">75%</button><button id="zoom-in" title="放大" aria-label="放大"><svg class="icon"><use href="#i-plus"/></svg></button></div></div>
  </div>
  <main id="workspace" class="workspace">
    <aside id="dock-left" class="left-sidebar dock-rail">
      <div id="dock-left-top" class="dock-zone" data-dock-zone="left-top">
        <section class="dock-panel" data-panel-id="pages" aria-label="页面面板"><header class="panel-header" data-panel-handle><svg class="icon panel-grip"><use href="#i-grip"/></svg><h2>页面</h2><div class="panel-controls"><button id="add-page" class="small-icon" title="添加页面" aria-label="添加页面"><svg class="icon"><use href="#i-plus"/></svg></button><button id="add-page-folder" class="small-icon" title="添加页面文件夹" aria-label="添加页面文件夹"><svg class="icon"><use href="#i-folder"/></svg></button></div></header><div class="panel-body"><div id="page-list" class="page-list"></div></div></section>
        <section class="dock-panel" data-panel-id="overview" aria-label="概览面板"><header class="panel-header" data-panel-handle><svg class="icon panel-grip"><use href="#i-grip"/></svg><h2>概览</h2><span id="layer-count" class="quiet-counter">0</span><div class="panel-controls"></div></header><div class="panel-body"><div id="layer-list" class="layer-list"></div></div></section>
      </div>
      <div class="dock-splitter" data-splitter="left" role="separator" aria-label="调整左侧面板高度" tabindex="0"></div>
      <div id="dock-left-bottom" class="dock-zone" data-dock-zone="left-bottom">
        <section class="dock-panel" data-panel-id="library" aria-label="元件库面板"><header class="panel-header" data-panel-handle><svg class="icon panel-grip"><use href="#i-grip"/></svg><h2>元件库</h2><div class="panel-controls"></div></header><div id="library-panel-content" class="panel-body"></div></section>
        <section class="dock-panel" data-panel-id="components" aria-label="母版面板"><header class="panel-header" data-panel-handle><svg class="icon panel-grip"><use href="#i-grip"/></svg><h2>母版</h2><div class="panel-controls"></div></header><div id="components-panel-content" class="panel-body"></div></section>
      </div>
      <div class="sidebar-bottom">本地项目<button id="help-button" class="small-icon" title="操作帮助" aria-label="操作帮助"><svg class="icon"><use href="#i-help"/></svg></button></div>
      <div class="rail-resizer" data-rail-resizer="left" role="separator" aria-label="调整左栏宽度" tabindex="0"></div>
    </aside>
    <section class="canvas-column">
      <div class="canvas-breadcrumb"><span id="page-breadcrumb">画布</span><span id="page-size"></span><span class="canvas-hint">拖动排版 · 双击改字 · Shift 多选</span></div>
      <div class="canvas-frame"><div id="ruler-x" aria-hidden="true"></div><div id="ruler-y" aria-hidden="true"></div><div id="canvas-viewport" class="canvas-viewport" tabindex="0" aria-label="设计画布">
        <div id="canvas-world" class="canvas-world"><div id="board-shell" class="board-shell"><div id="board" class="board"><div id="nodes"></div><div id="selection-overlay"></div><div id="marquee" hidden></div></div></div></div>
      </div></div>
      <section id="agent-panel" class="agent-panel" hidden>
        <div class="agent-header"><div><svg class="icon"><use href="#i-agent"/></svg><strong>Agent 工作台</strong><span class="agent-subtitle">直接操作 · 支持撤销</span></div><button id="agent-close" class="small-icon" title="收起工作台" aria-label="收起工作台"><svg class="icon"><use href="#i-close"/></svg></button></div>
        <div class="agent-content"><div class="agent-description"><p id="agent-status">正在读取连接信息</p><p class="agent-explain">接入 MCP 后，Codex 等本地 Agent 可以直接修改当前画布、选择元件、保存和导出，无需粘贴指令。右侧保留手动批量操作入口。</p><div class="agent-example-buttons"><button id="agent-example-style">试试：换个配色</button><button id="agent-example-card">试试：添加卡片</button></div><button id="copy-agent-info" class="text-button">复制 Agent 接入说明</button></div><div class="agent-editor"><textarea id="agent-commands" spellcheck="false" aria-label="Agent 指令批次" placeholder='可选：粘贴 {"commands": [...]} 或指令数组'></textarea><div class="agent-editor-footer"><span id="agent-validation">应用前会检查整批指令</span><button id="agent-review" class="secondary-button">检查指令</button><button id="agent-apply" class="primary-button" disabled>应用修改</button></div></div></div>
      </section>
      <footer class="statusbar"><span id="selection-status">准备就绪</span><span id="document-status">原创实现 · 本地编辑</span></footer>
    </section>
    <aside id="dock-right" class="right-sidebar dock-rail">
      <div id="dock-right-top" class="dock-zone" data-dock-zone="right-top">
        <section class="dock-panel" data-panel-id="styles" aria-label="样式面板"><header class="panel-header" data-panel-handle><svg class="icon panel-grip"><use href="#i-grip"/></svg><button id="design-tab" class="panel-title active" data-tab="design">样式</button><div class="panel-controls"></div></header><div id="styles-panel-content" class="panel-body"><div id="inspector" class="inspector"></div></div></section>
        <section class="dock-panel" data-panel-id="interactions" aria-label="交互面板"><header class="panel-header" data-panel-handle><svg class="icon panel-grip"><use href="#i-grip"/></svg><button id="interaction-tab" class="panel-title" data-tab="interaction">交互<span id="interaction-count" hidden></span></button><div class="panel-controls"></div></header><div id="interactions-panel-content" class="panel-body"></div></section>
      </div>
      <div class="dock-splitter" data-splitter="right" role="separator" aria-label="调整右侧面板高度" tabindex="0"></div>
      <div id="dock-right-bottom" class="dock-zone" data-dock-zone="right-bottom">
        <section class="dock-panel" data-panel-id="notes" aria-label="注释面板"><header class="panel-header" data-panel-handle><svg class="icon panel-grip"><use href="#i-grip"/></svg><h2>注释</h2><div class="panel-controls"></div></header><div id="notes-panel-content" class="panel-body"></div></section>
      </div>
      <div class="rail-resizer" data-rail-resizer="right" role="separator" aria-label="调整右栏宽度" tabindex="0"></div>
    </aside>
    <div id="floating-panels" class="floating-panels"></div><div id="dock-drop-marker" class="dock-drop-marker" hidden></div>
  </main>
  <div id="toast-stack" class="toast-stack" role="status" aria-live="polite"></div>
  <dialog id="message-dialog"><div class="dialog-heading"><h2 id="dialog-title"></h2><button id="dialog-close" class="small-icon" aria-label="关闭"><svg class="icon"><use href="#i-close"/></svg></button></div><div id="dialog-content"></div><div class="dialog-footer"><button id="dialog-ok" class="primary-button">知道了</button></div></dialog>
  <script src="docking.js"></script><script src="renderer.js"></script><script src="movement-model.js"></script><script src="workspace-tools.js"></script><script src="advanced-tools.js"></script><script type="module" src="vector-tools.js"></script>
  <script type="module" src="navigation-tools.js"></script>
  <script type="module" src="view-tools.js"></script>
  <script type="module" src="outline-tools.js"></script>
  <script type="module" src="library-tools.js"></script>
  <script type="module" src="image-tools.js"></script>
  <script type="module" src="style-tools.js"></script>
  <script type="module" src="drag-preview.js"></script>
  <script type="module" src="editor-shell.js"></script>
</body>
</html>
