name: Verify source
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-and-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/setup.mjs
      - run: npm test
      # These checks cover the model and local protocol, not native GUI acceptance.
